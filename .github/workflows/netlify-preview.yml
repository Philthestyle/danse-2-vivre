name: Deploy Preview to Netlify

on:
  push:
    branches:
      - "feat/**"
      - "fix/**"
      - "develop"
  workflow_dispatch:

concurrency:
  group: "netlify-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Install Netlify CLI
        # Pinned : netlify-cli@latest publie une dep cassée @netlify/ai
        run: npm install -g netlify-cli@26.1.0

      - name: Deploy preview to Netlify
        id: netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: https://danse-2-vivre-263.netlify.app
        run: |
          BRANCH_SLUG="${GITHUB_REF_NAME//\//-}"
          BRANCH_SLUG="${BRANCH_SLUG:0:37}"
          echo "Branch alias: $BRANCH_SLUG"

          # Retry x2 : les flakes Netlify (rate-limit, réseau, secret momentanément vide)
          # étaient la source des mails "Run failed" alors qu'un simple re-run passait.
          # Le tee vers /tmp/netlify-output.log permet de garder la sortie visible
          # ET de la parser après (avant, le `OUTPUT=$(...)` masquait toute erreur en
          # cas d'exit non-zéro à cause de `set -e`).
          for attempt in 1 2; do
            echo "::group::Netlify deploy — tentative $attempt/2"
            if netlify deploy \
              --build \
              --alias "$BRANCH_SLUG" \
              --message "Preview $GITHUB_REF_NAME · $GITHUB_SHA" \
              --site "$NETLIFY_SITE_ID" \
              --auth "$NETLIFY_AUTH_TOKEN" \
              | tee /tmp/netlify-output.log; then
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
            if [ "$attempt" -eq 2 ]; then
              echo "::error::Netlify deploy a échoué 2 fois de suite — voir logs ci-dessus"
              exit 1
            fi
            echo "Tentative $attempt échouée, retry dans 30s..."
            sleep 30
          done

          PREVIEW_URL=$(grep -Eo 'https://[a-z0-9-]+\.netlify\.app' /tmp/netlify-output.log | tail -1)
          echo "preview-url=$PREVIEW_URL" >> $GITHUB_OUTPUT

          echo "## 🚀 Preview déployé" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: \`$GITHUB_REF_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "**URL**: [$PREVIEW_URL]($PREVIEW_URL)" >> $GITHUB_STEP_SUMMARY

      - name: Comment PR (si PR existe)
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: netlify-preview
          message: |
            ### 🚀 Netlify preview

            **URL**: ${{ steps.netlify.outputs.preview-url }}

            Rebuild à chaque push sur cette branche.
