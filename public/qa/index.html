<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>QA Flows · Danse2Vivre</title>
<style>
  :root {
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2230; --border:#30363d;
    --text:#e6edf3; --muted:#8b949e; --accent:#4493f8;
    --pass:#3fb950; --fail:#f85149; --skip:#8b949e; --pending:#d29922;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,sans-serif;background:var(--bg);color:var(--text);font-size:14px;display:flex;flex-direction:column;min-height:100vh}
  header{padding:16px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;background:var(--panel);flex-wrap:wrap}
  header h1{margin:0;font-size:18px;font-weight:600}
  header .badge{background:var(--panel2);padding:4px 10px;border-radius:12px;font-size:12px;color:var(--muted)}
  header .tester-pill{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--border);padding:5px 10px 5px 12px;border-radius:14px;font-size:12px}
  header .tester-pill strong{color:var(--text);font-weight:600}
  header .tester-pill button{background:var(--panel);color:var(--muted);border:1px solid var(--border);padding:3px 8px;border-radius:10px;cursor:pointer;font-size:11px}
  header .tester-pill button:hover{color:var(--text)}
  header .sync-state{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
  header .sync-state .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
  header .sync-state.online .dot{background:var(--pass)}
  header .sync-state.offline .dot{background:var(--fail)}
  header .sync-state.syncing .dot{background:var(--pending);animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
  header nav{margin-left:auto;display:flex;gap:8px}
  header nav a{color:var(--muted);text-decoration:none;font-size:13px;padding:6px 12px;border-radius:6px}
  header nav a:hover{background:var(--panel2);color:var(--text)}
  .layout{display:grid;grid-template-columns:280px 1fr;flex:1;min-height:0}
  aside{background:var(--panel);border-right:1px solid var(--border);padding:12px;overflow-y:auto}
  aside .toolbar{display:flex;gap:6px;margin-bottom:12px}
  aside .toolbar button{flex:1;background:var(--panel2);color:var(--text);border:1px solid var(--border);padding:6px 8px;border-radius:6px;cursor:pointer;font-size:12px}
  aside .toolbar button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  aside .section-title{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:12px 4px 6px;margin-top:6px}
  aside .peer{padding:6px 8px;font-size:12px;color:var(--muted);border-radius:4px;display:flex;align-items:center;gap:6px;cursor:pointer}
  aside .peer:hover{background:var(--panel2);color:var(--text)}
  aside .peer.me{color:var(--text)}
  aside .peer .dot{width:6px;height:6px;border-radius:50%;background:var(--muted)}
  aside .peer.me .dot{background:var(--accent)}
  .flow-item{padding:10px 12px;border-radius:6px;cursor:pointer;margin-bottom:4px;display:flex;align-items:center;gap:8px;font-size:13px;border:1px solid transparent}
  .flow-item:hover{background:var(--panel2)}
  .flow-item.active{background:var(--panel2);border-color:var(--accent)}
  .flow-item .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .flow-item .progress{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .flow-item .status-dot{width:8px;height:8px;border-radius:50%}
  .status-dot.pass{background:var(--pass)} .status-dot.fail{background:var(--fail)} .status-dot.pending{background:var(--pending)} .status-dot.skip{background:var(--skip)}
  main{padding:20px 28px;overflow-y:auto}
  .flow-header{display:flex;align-items:baseline;gap:12px;margin-bottom:6px;flex-wrap:wrap}
  .flow-header h2{margin:0;font-size:22px}
  .flow-header .role{background:var(--panel2);border:1px solid var(--border);padding:3px 10px;border-radius:12px;font-size:12px;color:var(--muted)}
  .flow-desc{color:var(--muted);margin-bottom:20px;line-height:1.5}
  .summary{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
  .chip{background:var(--panel);border:1px solid var(--border);padding:6px 12px;border-radius:20px;font-size:12px;display:flex;align-items:center;gap:6px}
  .chip .dot{width:8px;height:8px;border-radius:50%}
  .progress-bar{background:var(--panel);height:6px;border-radius:3px;overflow:hidden;margin-bottom:20px;display:flex}
  .progress-bar > div{height:100%}
  .steps{display:flex;flex-direction:column;gap:8px}
  .step{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:14px 16px}
  .step.pass{border-left:3px solid var(--pass)}
  .step.fail{border-left:3px solid var(--fail)}
  .step.skip{border-left:3px solid var(--skip);opacity:.7}
  .step .row1{display:flex;align-items:center;gap:12px}
  .step .num{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px;min-width:24px}
  .step .txt{flex:1;line-height:1.4}
  .step .actions{display:flex;gap:4px}
  .step .actions button{background:var(--panel2);color:var(--text);border:1px solid var(--border);padding:4px 10px;border-radius:6px;cursor:pointer;font-size:12px}
  .step .actions button.active.pass{background:var(--pass);border-color:var(--pass);color:#fff}
  .step .actions button.active.fail{background:var(--fail);border-color:var(--fail);color:#fff}
  .step .actions button.active.skip{background:var(--skip);border-color:var(--skip);color:#fff}
  .step .note{margin-top:8px;width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--border);padding:6px 10px;border-radius:6px;font-family:inherit;font-size:12px;resize:vertical;min-height:36px;display:none}
  .step.has-note .note, .step.editing-note .note {display:block}
  .step .icon-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;padding:2px 6px;border-radius:4px}
  .step .icon-btn:hover{color:var(--text);background:var(--panel2)}
  .add-step{margin-top:12px;display:flex;gap:8px}
  .add-step input{flex:1;background:var(--panel2);color:var(--text);border:1px solid var(--border);padding:8px 12px;border-radius:6px;font-size:13px}
  .add-step button{background:var(--accent);color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500}
  .flow-actions{display:flex;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
  .flow-actions button{background:var(--panel);color:var(--text);border:1px solid var(--border);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px}
  .flow-actions button.danger{color:var(--fail)}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100}
  .modal-bg.open{display:flex}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:20px;width:480px;max-width:92vw}
  .modal h2{margin:0 0 16px;font-size:16px}
  .modal .field{margin-bottom:12px}
  .modal label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  .modal input,.modal select,.modal textarea{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--border);padding:8px 10px;border-radius:6px;font-family:inherit;font-size:13px}
  .modal textarea{resize:vertical;min-height:60px}
  .modal .hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.4}
  .modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
  .modal button{background:var(--panel2);color:var(--text);border:1px solid var(--border);padding:8px 14px;border-radius:6px;cursor:pointer;font-size:13px}
  .modal button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
</style>
</head>
<body>
<header>
  <h1>🧪 QA Flows</h1>
  <span class="badge">Danse2Vivre</span>
  <span class="tester-pill" id="tester-pill" style="display:none">
    Testeur : <strong id="tester-name">—</strong>
    <button id="btn-switch-tester">Changer</button>
  </span>
  <span class="sync-state" id="sync-state"><span class="dot"></span><span id="sync-label">Init…</span></span>
  <nav>
    <a href="/">← Retour au site</a>
  </nav>
</header>
<div class="layout">
  <aside>
    <div class="toolbar">
      <button class="primary" id="btn-new-flow">+ Flow</button>
      <button id="btn-reset">↺ Reset</button>
    </div>
    <div id="flows-list"></div>
    <div class="section-title">Autres testeurs</div>
    <div id="peers-list"><div style="color:var(--muted);font-size:12px;padding:6px 4px">Aucun autre testeur.</div></div>
  </aside>
  <main id="main"></main>
</div>

<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <h2 id="modal-title">Nouveau flow</h2>
    <div class="field"><label>Nom du flow</label><input type="text" id="f-name" placeholder="Login flow"/></div>
    <div class="field"><label>Rôle testé</label><input type="text" id="f-role" placeholder="Membre / Prof / Admin / Anonyme"/></div>
    <div class="field"><label>Description</label><textarea id="f-desc" placeholder="Objectif du flow, préconditions..."></textarea></div>
    <div class="actions"><button id="btn-cancel">Annuler</button><button class="primary" id="btn-save">Enregistrer</button></div>
  </div>
</div>

<div class="modal-bg" id="tester-modal-bg">
  <div class="modal">
    <h2>Qui est-ce ?</h2>
    <div class="field">
      <label>Ton pseudo (visible par les autres testeurs)</label>
      <input type="text" id="t-name" placeholder="allan / faustin / ..."/>
    </div>
    <div class="hint">Chaque testeur a sa propre session isolée sauvegardée en base. Choisis un pseudo unique — si tu réutilises un pseudo existant, tu reprends cette session.</div>
    <div class="actions"><button class="primary" id="btn-tester-save">Commencer</button></div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.45.4';

const TESTER_KEY = 'd2v-qa-tester';
const LOCAL_PREFIX = 'd2v-qa-v2:';

function newStep(text){ return {id:crypto.randomUUID(), text, status:'pending', note:''}; }

const SEED = [
  {id:crypto.randomUUID(),name:'Register flow',role:'Anonyme',desc:'Inscription complète d\'un nouveau membre.',steps:[
    'Accéder à /inscription','Remplir email + mot de passe + confirmation','Accepter les CGU','Soumettre le formulaire','Recevoir email de confirmation','Cliquer sur le lien de confirmation','Être redirigé vers l\'espace membre','✅ Vérifier qu\'AUCUNE mention paiement n\'apparaît sur la page inscription (shipped 2026-08-29)'
  ].map(newStep)},
  {id:crypto.randomUUID(),name:'Login / Logout flow',role:'Membre',desc:'Connexion, navigation post-login, déconnexion.',steps:[
    'Accéder à /connexion','Saisir identifiants valides','Soumettre → redirection espace membre','Quitter l\'espace membre (aller page publique)','✅ Vérifier header : lien "Espace membre" visible (shipped 2026-08-29)','✅ Vérifier header : bouton "Déconnexion" visible (shipped 2026-08-29)','Cliquer Déconnexion','Vérifier retour état anonyme'
  ].map(newStep)},
  {id:crypto.randomUUID(),name:'Profil Membre',role:'Membre',desc:'Contenu du profil pour un rôle member.',steps:[
    'Se connecter en tant que membre','Accéder au profil','Vérifier présence du bloc Adhésion (voulu pour member)','Éditer les infos personnelles','Sauvegarder','Vérifier persistance après refresh','Vérifier ABSENCE de bloc création conversation/groupe (voulu)'
  ].map(newStep)},
  {id:crypto.randomUUID(),name:'Profil Professeur',role:'Prof',desc:'Contenu du profil prof.',steps:[
    'Se connecter en tant que prof','Accéder au profil','✅ Vérifier ABSENCE du bloc Adhésion (shipped 2026-08-29)','Éditer les infos + bio + ville + tarifs','Uploader une photo','Sauvegarder + refresh','Vérifier visibilité côté fiche publique'
  ].map(newStep)},
  {id:crypto.randomUUID(),name:'Profil Admin',role:'Admin',desc:'Profil admin.',steps:[
    'Se connecter en admin','Accéder au profil','✅ Vérifier ABSENCE du bloc Adhésion (shipped 2026-08-29)','Accéder aux outils d\'administration'
  ].map(newStep)},
  {id:crypto.randomUUID(),name:'Contacter un professeur',role:'Anonyme + Membre',desc:'Bouton "Contacter" sur la fiche prof — doit envoyer un mail direct.',steps:[
    'Ouvrir la fiche d\'un prof en anonyme','✅ Cliquer "Contacter" → mailto: vers l\'email du prof (shipped 2026-08-29)','Vérifier ABSENCE de tentative de création de conversation interne','Se connecter en tant que membre','Rouvrir la même fiche prof','✅ Cliquer "Contacter" → même comportement mail (shipped 2026-08-29)','Envoyer un message test → vérifier réception côté prof'
  ].map(newStep)},
  {id:crypto.randomUUID(),name:'Messagerie Membre',role:'Membre',desc:'Message privé entre membres (si applicable).',steps:[
    'Se connecter en membre','Ouvrir la messagerie','Vérifier absence de création convo/groupe (voulu)','Vérifier réception d\'un message entrant'
  ].map(newStep)},
  {id:crypto.randomUUID(),name:'Messagerie Professeur',role:'Prof',desc:'⚠ Spec en cours de refonte par Allan — flow à mettre à jour après réception.',steps:[
    'Se connecter en tant que prof','Ouvrir la messagerie','Tenter de créer une conversation','Tenter de créer un groupe','⚠ Documenter les blocages (spec en attente d\'Allan)'
  ].map(newStep)},
  {id:crypto.randomUUID(),name:'CRUD contenu — Création',role:'Prof / Admin',desc:'Créer les entités visibles côté public.',steps:[
    'Créer un cours','Créer un événement','Créer un article / actualité','Vérifier apparition côté public'
  ].map(newStep)},
  {id:crypto.randomUUID(),name:'CRUD contenu — Édition',role:'Prof / Admin',desc:'',steps:[
    'Éditer un cours existant','Éditer un événement','Éditer un article','Vérifier persistance + reflet côté public'
  ].map(newStep)},
  {id:crypto.randomUUID(),name:'CRUD contenu — Suppression',role:'Prof / Admin',desc:'',steps:[
    'Supprimer un cours (avec confirmation)','Supprimer un événement','Supprimer un article','Vérifier disparition côté public'
  ].map(newStep)},
  {id:crypto.randomUUID(),name:'Mot de passe oublié',role:'Anonyme',desc:'',steps:[
    'Accéder à /connexion','Cliquer "Mot de passe oublié"','Saisir email','Recevoir email de reset','Cliquer le lien','Définir nouveau mot de passe','Se reconnecter avec le nouveau'
  ].map(newStep)},
  {id:crypto.randomUUID(),name:'Responsive & mobile',role:'Tous',desc:'Passage rapide mobile/tablette.',steps:[
    'Header (menu burger)','Home','Fiche prof','Inscription','Login','Espace membre','Messagerie'
  ].map(newStep)}
];

let sb = null;
let tester = null;
let flows = [];
let activeId = null;
let editingFlowId = null;
let peers = [];
let saveTimer = null;
let syncMode = 'local';

function setSync(state, label){
  const el = document.getElementById('sync-state');
  el.classList.remove('online','offline','syncing');
  el.classList.add(state);
  document.getElementById('sync-label').textContent = label;
}

async function initSupabase(){
  try {
    const res = await fetch('/api/qa/config');
    if(!res.ok) throw new Error('config unavailable');
    const cfg = await res.json();
    if(!cfg.url || !cfg.anonKey) throw new Error('no keys');
    sb = createClient(cfg.url, cfg.anonKey);
    syncMode = 'supabase';
    setSync('online', 'Sync Supabase');
    return true;
  } catch(e) {
    syncMode = 'local';
    setSync('offline', 'Offline (localStorage)');
    return false;
  }
}

function getStoredTester(){ try { return localStorage.getItem(TESTER_KEY); } catch { return null; } }
function setStoredTester(name){ try { localStorage.setItem(TESTER_KEY, name); } catch {} }
function showTesterModal(prefill){
  document.getElementById('t-name').value = prefill || '';
  document.getElementById('tester-modal-bg').classList.add('open');
  setTimeout(()=>document.getElementById('t-name').focus(),50);
}
function hideTesterModal(){ document.getElementById('tester-modal-bg').classList.remove('open'); }
async function chooseTester(name){
  name = name.trim().toLowerCase().replace(/[^a-z0-9_\-]/g,'').slice(0,32);
  if(!name){ alert('Pseudo requis (lettres, chiffres, - ou _)'); return; }
  tester = name;
  setStoredTester(name);
  document.getElementById('tester-name').textContent = name;
  document.getElementById('tester-pill').style.display = 'flex';
  hideTesterModal();
  await loadSession();
  await loadPeers();
  renderSidebar();
  renderMain();
}

function localKey(name){ return LOCAL_PREFIX + name; }
async function loadSession(){
  if(syncMode === 'supabase'){
    setSync('syncing', 'Chargement…');
    const { data, error } = await sb
      .from('qa_sessions')
      .select('flows')
      .eq('tester_name', tester)
      .maybeSingle();
    if(error){
      console.warn('[QA] Supabase load error, falling back to local', error);
      loadLocal();
      setSync('offline', 'Erreur DB — offline');
      return;
    }
    if(data?.flows && Array.isArray(data.flows) && data.flows.length){
      flows = data.flows;
    } else {
      flows = JSON.parse(JSON.stringify(SEED));
      await persistSession();
    }
    setSync('online', 'Sync Supabase');
  } else {
    loadLocal();
  }
  activeId = flows[0]?.id ?? null;
}
function loadLocal(){
  try {
    const raw = localStorage.getItem(localKey(tester));
    if(raw){ flows = JSON.parse(raw); return; }
  } catch {}
  flows = JSON.parse(JSON.stringify(SEED));
  try { localStorage.setItem(localKey(tester), JSON.stringify(flows)); } catch {}
}
function scheduleSave(){
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(persistSession, 400);
}
async function persistSession(){
  if(!tester) return;
  if(syncMode === 'supabase'){
    setSync('syncing', 'Sauvegarde…');
    const { error } = await sb
      .from('qa_sessions')
      .upsert({ tester_name: tester, flows }, { onConflict: 'tester_name' });
    if(error){
      console.warn('[QA] Supabase save error, keeping local', error);
      try { localStorage.setItem(localKey(tester), JSON.stringify(flows)); } catch {}
      setSync('offline', 'Erreur DB — offline');
    } else {
      setSync('online', 'Sync Supabase');
    }
  } else {
    try { localStorage.setItem(localKey(tester), JSON.stringify(flows)); } catch {}
  }
}
async function loadPeers(){
  peers = [];
  if(syncMode !== 'supabase') { renderPeers(); return; }
  const { data } = await sb
    .from('qa_sessions')
    .select('tester_name, updated_at')
    .order('updated_at', { ascending: false })
    .limit(50);
  peers = data ?? [];
  renderPeers();
}

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function flowStatus(f){
  if(!f.steps.length) return 'pending';
  const c = {pass:0,fail:0,skip:0,pending:0};
  f.steps.forEach(s=>c[s.status]++);
  if(c.fail>0) return 'fail';
  if(c.pending>0) return 'pending';
  if(c.pass>0) return 'pass';
  return 'skip';
}
function renderSidebar(){
  document.getElementById('flows-list').innerHTML = flows.map(f=>{
    const done = f.steps.filter(s=>s.status!=='pending').length;
    return `<div class="flow-item ${f.id===activeId?'active':''}" data-id="${f.id}">
      <span class="status-dot ${flowStatus(f)}"></span>
      <span class="name">${escapeHtml(f.name)}</span>
      <span class="progress">${done}/${f.steps.length}</span>
    </div>`;
  }).join('');
  document.querySelectorAll('.flow-item').forEach(el=>{
    el.onclick = ()=>{ activeId = el.dataset.id; renderSidebar(); renderMain(); };
  });
}
function renderPeers(){
  const others = peers.filter(p => p.tester_name !== tester);
  const container = document.getElementById('peers-list');
  const me = `<div class="peer me" data-peer="${escapeHtml(tester||'')}"><span class="dot"></span>${escapeHtml(tester||'')} (moi)</div>`;
  const otherHtml = others.length
    ? others.map(p => `<div class="peer" data-peer="${escapeHtml(p.tester_name)}" title="Cliquer pour ouvrir la session"><span class="dot"></span>${escapeHtml(p.tester_name)}</div>`).join('')
    : '<div style="color:var(--muted);font-size:12px;padding:6px 4px">Aucun autre testeur.</div>';
  container.innerHTML = me + otherHtml;
  container.querySelectorAll('.peer:not(.me)').forEach(el=>{
    el.onclick = ()=>{
      if(confirm(`Ouvrir la session de "${el.dataset.peer}" ? (ta session actuelle reste sauvegardée)`))
        chooseTester(el.dataset.peer);
    };
  });
}
function renderMain(){
  const f = flows.find(x=>x.id===activeId);
  if(!f){ document.getElementById('main').innerHTML = '<div style="color:var(--muted);padding:40px;text-align:center">Aucun flow sélectionné.</div>'; return; }
  const c = {pass:0,fail:0,skip:0,pending:0}; f.steps.forEach(s=>c[s.status]++);
  const total = f.steps.length || 1;
  const pct = k => (c[k]/total*100).toFixed(1)+'%';
  document.getElementById('main').innerHTML = `
    <div class="flow-header">
      <h2>${escapeHtml(f.name)}</h2>
      ${f.role?`<span class="role">${escapeHtml(f.role)}</span>`:''}
    </div>
    ${f.desc?`<div class="flow-desc">${escapeHtml(f.desc)}</div>`:''}
    <div class="summary">
      <span class="chip"><span class="dot" style="background:var(--pass)"></span>Pass ${c.pass}</span>
      <span class="chip"><span class="dot" style="background:var(--fail)"></span>Fail ${c.fail}</span>
      <span class="chip"><span class="dot" style="background:var(--skip)"></span>Skip ${c.skip}</span>
      <span class="chip"><span class="dot" style="background:var(--pending)"></span>Pending ${c.pending}</span>
    </div>
    <div class="progress-bar">
      <div style="width:${pct('pass')};background:var(--pass)"></div>
      <div style="width:${pct('fail')};background:var(--fail)"></div>
      <div style="width:${pct('skip')};background:var(--skip)"></div>
    </div>
    <div class="steps">
      ${f.steps.map((s,i)=>`
        <div class="step ${s.status} ${s.note?'has-note':''}" data-id="${s.id}">
          <div class="row1">
            <span class="num">${String(i+1).padStart(2,'0')}</span>
            <div class="txt" contenteditable="true" data-field="text">${escapeHtml(s.text)}</div>
            <div class="actions">
              <button data-status="pass" class="${s.status==='pass'?'active pass':''}">✓</button>
              <button data-status="fail" class="${s.status==='fail'?'active fail':''}">✗</button>
              <button data-status="skip" class="${s.status==='skip'?'active skip':''}">↷</button>
              <button data-status="pending" class="${s.status==='pending'?'active':''}">○</button>
              <button class="icon-btn" data-act="note" title="Note">📝</button>
              <button class="icon-btn" data-act="del" title="Supprimer">✕</button>
            </div>
          </div>
          <textarea class="note" placeholder="Note / observation / lien vers un fix...">${escapeHtml(s.note||'')}</textarea>
        </div>
      `).join('')}
    </div>
    <div class="add-step">
      <input type="text" id="new-step" placeholder="Nouvelle étape (Enter pour ajouter)"/>
      <button id="btn-add-step">+ Ajouter</button>
    </div>
    <div class="flow-actions">
      <button id="btn-reset-flow">↺ Reset statuts</button>
      <button id="btn-edit-flow">✎ Éditer flow</button>
      <button id="btn-del-flow" class="danger">✕ Supprimer flow</button>
    </div>`;
  attachStepHandlers(f);
}
function attachStepHandlers(f){
  document.querySelectorAll('.step').forEach(el=>{
    const id = el.dataset.id;
    const step = f.steps.find(s=>s.id===id);
    el.querySelectorAll('.actions button[data-status]').forEach(b=>{
      b.onclick = ()=>{ step.status = b.dataset.status; scheduleSave(); renderMain(); renderSidebar(); };
    });
    el.querySelector('[data-act="note"]').onclick = ()=>{ el.classList.toggle('editing-note'); el.querySelector('.note').focus(); };
    el.querySelector('[data-act="del"]').onclick = ()=>{ f.steps = f.steps.filter(s=>s.id!==id); scheduleSave(); renderMain(); renderSidebar(); };
    el.querySelector('.note').onblur = e=>{ step.note = e.target.value; scheduleSave(); };
    el.querySelector('[data-field="text"]').onblur = e=>{ step.text = e.target.innerText.trim(); scheduleSave(); renderSidebar(); };
  });
  const inp = document.getElementById('new-step');
  const addBtn = document.getElementById('btn-add-step');
  const add = ()=>{ const v = inp.value.trim(); if(!v) return; f.steps.push(newStep(v)); scheduleSave(); renderMain(); renderSidebar(); setTimeout(()=>document.getElementById('new-step').focus(),50); };
  addBtn.onclick = add;
  inp.onkeydown = e=>{ if(e.key==='Enter') add(); };
  document.getElementById('btn-reset-flow').onclick = ()=>{ if(confirm('Remettre toutes les étapes en pending ?')){ f.steps.forEach(s=>s.status='pending'); scheduleSave(); renderMain(); renderSidebar(); }};
  document.getElementById('btn-edit-flow').onclick = ()=>openFlowModal(f.id);
  document.getElementById('btn-del-flow').onclick = ()=>{ if(confirm('Supprimer ce flow ?')){ flows = flows.filter(x=>x.id!==f.id); activeId = flows[0]?.id ?? null; scheduleSave(); renderSidebar(); renderMain(); }};
}
function openFlowModal(id){
  editingFlowId = id;
  const f = id ? flows.find(x=>x.id===id) : {name:'',role:'',desc:''};
  document.getElementById('modal-title').textContent = id ? 'Éditer le flow' : 'Nouveau flow';
  document.getElementById('f-name').value = f.name;
  document.getElementById('f-role').value = f.role;
  document.getElementById('f-desc').value = f.desc;
  document.getElementById('modal-bg').classList.add('open');
  setTimeout(()=>document.getElementById('f-name').focus(),50);
}
function closeModal(){ document.getElementById('modal-bg').classList.remove('open'); editingFlowId=null; }
function saveFlow(){
  const name = document.getElementById('f-name').value.trim();
  const role = document.getElementById('f-role').value.trim();
  const desc = document.getElementById('f-desc').value.trim();
  if(!name){ alert('Nom requis'); return; }
  if(editingFlowId){
    const f = flows.find(x=>x.id===editingFlowId); Object.assign(f,{name,role,desc});
  } else {
    const nf = {id:crypto.randomUUID(),name,role,desc,steps:[]};
    flows.push(nf); activeId = nf.id;
  }
  scheduleSave(); renderSidebar(); renderMain(); closeModal();
}

document.getElementById('btn-new-flow').onclick = ()=>openFlowModal(null);
document.getElementById('btn-cancel').onclick = closeModal;
document.getElementById('btn-save').onclick = saveFlow;
document.getElementById('modal-bg').onclick = e=>{ if(e.target.id==='modal-bg') closeModal(); };
document.getElementById('btn-reset').onclick = async ()=>{
  if(!confirm('Recharger la liste initiale POUR TOI ('+tester+') ? Cela écrase ta session.')) return;
  flows = JSON.parse(JSON.stringify(SEED)); activeId = flows[0].id;
  await persistSession(); renderSidebar(); renderMain();
};
document.getElementById('btn-switch-tester').onclick = ()=>{ showTesterModal(); };
document.getElementById('btn-tester-save').onclick = ()=>{
  chooseTester(document.getElementById('t-name').value);
};
document.getElementById('t-name').addEventListener('keydown', e=>{ if(e.key==='Enter') chooseTester(e.target.value); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

(async function boot(){
  await initSupabase();
  const stored = getStoredTester();
  if(stored) await chooseTester(stored);
  else showTesterModal();
  if(syncMode === 'supabase') setInterval(loadPeers, 30000);
})();
</script>
</body>
</html>
